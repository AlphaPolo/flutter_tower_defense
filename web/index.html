<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="布陣守護主堡的六角策略塔防。">
  <meta name="theme-color" content="#241811">

  <!-- 社群分享預覽（Open Graph / Twitter Card） -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="元素塔防">
  <meta property="og:description" content="布陣守護主堡的六角策略塔防——元素塔、陷阱與無盡排行榜。">
  <meta property="og:image" content="https://fluttertowerdefense.web.app/icons/Icon-512.png">
  <meta property="og:url" content="https://fluttertowerdefense.web.app/">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="元素塔防">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>元素塔防</title>
  <link rel="manifest" href="manifest.json">

  <!-- 載入 splash：Flutter 首幀（flutter-first-frame）前顯示，避免白屏/素 spinner -->
  <style>
    html, body { background: #241811; margin: 0; height: 100%; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
      background: radial-gradient(ellipse at 50% 42%, #4a3627 0%, #241811 70%);
      transition: opacity .45s ease-out;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash img {
      width: 96px; height: 96px; border-radius: 20px;
      box-shadow: 0 6px 24px rgba(0,0,0,.55);
      animation: bob 2.8s ease-in-out infinite;
    }
    #splash h1 {
      color: #e8c877; font: 900 26px/1 system-ui, sans-serif;
      letter-spacing: 6px; margin: 0; text-shadow: 0 2px 8px rgba(0,0,0,.6);
    }
    #splash .bar {
      width: 180px; height: 6px; border-radius: 3px; overflow: hidden;
      background: rgba(0,0,0,.45); border: 1px solid rgba(182,131,43,.55);
    }
    #splash .bar::before {
      content: ''; display: block; height: 100%; width: 40%;
      border-radius: 3px;
      background: linear-gradient(90deg, #b6832b, #e8c877, #b6832b);
      animation: sweep 1.2s ease-in-out infinite;
    }
    @keyframes bob   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes sweep { 0% { margin-left: -40% } 100% { margin-left: 100% } }
    @media (prefers-reduced-motion: reduce) {
      #splash img, #splash .bar::before { animation: none; }
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  <!-- flutter_soloud 音訊引擎（WASM）：web 平台必要的兩個 script -->
  <script src="assets/packages/flutter_soloud/web/libflutter_soloud_plugin.js" defer></script>
  <script src="assets/packages/flutter_soloud/web/init_module.dart.js" defer></script>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <h1>元素塔防</h1>
    <div class="bar"></div>
  </div>
  <script>
    // Flutter 畫出第一幀 → splash 淡出移除。
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('splash');
      if (!el) return;
      el.classList.add('gone');
      setTimeout(function () { el.remove(); }, 500);
    });
  </script>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function(appRunner) {
        return appRunner.runApp();
      });
    });
  </script>
</body>
</html>
